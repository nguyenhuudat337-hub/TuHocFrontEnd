<!DOCTYPE html>
<html lang="en">
<head>
    <link rel = "stylesheet" href = "style.css" >
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <script src ="main.js"></script>
    <div class = "all-part">
        <h1>Hệ thống hack MXH uy tín số 1 VN!!!!</h1>
        <img class="logo" src="4D174C57-B880-4D50-9BFA-5235FC228B07_1_201_a.jpeg" alt="logo">
        <div class ="form-login">
            <h2>Đăng nhập</h2>
            <p>Chào mừng bạn đến với hệ thống của chúng tôi</p>
            <form>   
                <div class="email">
                    <label for="email">Tài khoản</label>
                    <input type="email" id = "email" placeholder="Nhập email" required>
                </div>

                <div class="password">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id = "password" minlength="6" placeholder="Nhập mật khẩu" required>
                </div>

                <div class="form-options">
                    <div class = "remember-me">
                        <input type="checkbox" id="remember" >
                        <label for="remember">Remember me</label>
                    </div>

                    <a href="/forgot-password" class="forgot-pass">Forgot password?</a>
                </div>

        
                <button class="btn-login" type ="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
