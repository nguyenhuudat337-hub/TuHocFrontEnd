<!DOCTYPE html>
<html lang="en">
<head>
    <link rel ="stylesheet" href ="/CSS/homepage.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ</title>
</head>
<body>
    <div class =  "title">
        <h1>HDAT MOBILE</h1>
        <p>Uy tín tạo nên thương hiệu</p>
    </div>
    <img class="bgr-home" src = "/Picture/bgrhome.png"></img>
    <p>DANH SÁCH SẢN PHẨM</p>
    <div class = "header"> 
        <input class= "searchproduct" type="text" placeholder="Nhập tên sản phầm"></input>
        <button class="btn-cart">
            <div>
                <span class="cart-count"></span>
                <img class="cart" src ="https://cdn-icons-png.flaticon.com/512/1413/1413908.png">
            </div>
            <p>Giỏ Hàng</p>
        </button>
    </div>
    <div class ="bar">
        <select id="sortPrice">
            <option value="default">Mặc định</option>
            <option value="asc">Giá tăng dần</option>
            <option value="desc">Giá giảm dần</option>
        </select>
            <button class="category-btn active" data-category="all">Tất cả</button>
            <button class="category-btn" data-category="phone">Điện thoại</button>
            <button class="category-btn" data-category="laptop">Laptop</button>
            <button class="category-btn" data-category="watch">Đồng hồ</button>
            <button class="category-btn" data-category="audio">Tai nghe / Loa</button>
            <button class="category-btn" data-category="accessory">Phụ kiện</button>
    </div>
    <div class = "container">
        <div id= "product-grid" class = "product-grid"></div>
    </div>
    <script src ="/JS/homepage.js"></script>
</body>
</html>
