<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/register.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <H1>CREATE AN ACCOUNT FOR WHAT PURPOSES!!!!</H1>
    <form class="box-register">
        <image id="logoApp" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTJ0-W73GkahMPszJpvQfvLs2UhKHmfLflvP0QrpA9UaQ-YdtrBFjZxai0G&s=10"></image>
        <h3>CREAT YOUR ACCOUNT</h3>
        <div class="input-box">
            <i class="fa-solid fa-user">👤</i>
            <input id="input-name" type="text" placeholder="Username">
        </div>
        
        <div class="input-box">
            <i class="fa-solid fa-lock">🔒</i>
            <input id="input-pass" type="password" placeholder="Password">
        </div>
        
        <div class="input-box">
            <i class="fa-solid fa-lock">🔒</i>
            <input id="input-confirmPass" type="password" placeholder="Confirm Password">
        </div>
        <button id="btnSubmit" type="submit">Submit</button>
        <a href="login.html">You already have an account?</a>
    </form>
    <script src="/css/register.css"></script>
</body>
</html>
